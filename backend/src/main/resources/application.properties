# Uygulama adi ve calisma portu
spring.application.name=fittrack-backend
server.port=8080

# Docker uzerindeki PostgreSQL veritabani baglanti ayarlari
spring.datasource.url=jdbc:postgresql://localhost:5432/fittrack_db
spring.datasource.username=postgres
spring.datasource.password=123456

# JPA ve Hibernate ayarlari (Java siniflarindan tablolari otomatik olusturur)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true